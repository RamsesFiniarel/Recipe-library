<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe library</title>
    <meta name="description" content="A family recipe library: books of recipes on 3D shelves." />
    <meta name="theme-color" content="#f2ede4" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <!-- Installed as an app (Chrome, Android), and on an iPhone's home screen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <!-- Library-to-book transition (see cover-backdrop.js). Before #app so the
         library's canvas, same z-index, stays above it. -->
    <div class="cover-backdrop cover-backdrop--transition" aria-hidden="true"></div>
    <div id="app"></div>
    <div class="page-transition-veil"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
